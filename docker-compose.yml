services:

  pinatmenfess:
    build:
      context: .
      dockerfile: Dockerfile

    pull_policy: build
    restart: unless-stopped

    ports:
      - "${APP_PORT:-8001}:8000"

    environment:
      APP_NAME: "${APP_NAME:-Fess}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL}"

      APP_LOCALE: "${APP_LOCALE:-en}"
      APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE:-en}"
      APP_FAKER_LOCALE: "${APP_FAKER_LOCALE:-en_US}"
      APP_MAINTENANCE_DRIVER: "${APP_MAINTENANCE_DRIVER:-file}"

      BCRYPT_ROUNDS: "${BCRYPT_ROUNDS:-12}"

      LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
      LOG_STACK: "${LOG_STACK:-single}"
      LOG_DEPRECATIONS_CHANNEL: "${LOG_DEPRECATIONS_CHANNEL:-null}"
      LOG_LEVEL: "${LOG_LEVEL:-error}"

      DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"

      SESSION_DRIVER: "${SESSION_DRIVER:-redis}"
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
      SESSION_ENCRYPT: "${SESSION_ENCRYPT:-false}"
      SESSION_PATH: "${SESSION_PATH:-/}"
      SESSION_DOMAIN: "${SESSION_DOMAIN:-null}"
      SESSION_COOKIE: "${SESSION_COOKIE:-pinatmenfess_session}"

      BROADCAST_CONNECTION: "${BROADCAST_CONNECTION:-log}"
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-s3}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-redis}"
      CACHE_STORE: "${CACHE_STORE:-redis}"

      REDIS_CLIENT: "${REDIS_CLIENT:-phpredis}"
      REDIS_HOST: "${REDIS_HOST}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-null}"
      REDIS_PORT: "${REDIS_PORT:-6379}"

      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
      AWS_BUCKET: "${AWS_BUCKET}"
      AWS_ENDPOINT: "${AWS_ENDPOINT}"
      AWS_USE_PATH_STYLE_ENDPOINT: "${AWS_USE_PATH_STYLE_ENDPOINT:-true}"

      PINAT_AUTH_URL: "${PINAT_AUTH_URL:-https://auth.pinat.nl}"
      PINAT_AUTH_CLIENT_ID: "${PINAT_AUTH_CLIENT_ID}"

      PUBLIC_ID_PREFIX: "${PUBLIC_ID_PREFIX:-MF}"

      MUSIC_PROVIDERS: "${MUSIC_PROVIDERS:-youtube_music,spotify,apple,audius}"
      YTMUSIC_API_BASE_URL: "http://ytmusic:8765"
      YTMUSIC_LANGUAGE: "${YTMUSIC_LANGUAGE:-en}"
      YTMUSIC_REGION: "${YTMUSIC_REGION:-ID}"
      YTMUSIC_TIMEOUT_SEC: "${YTMUSIC_TIMEOUT_SEC:-6}"
      AUDIUS_BASE_URL: "${AUDIUS_BASE_URL:-https://api.audius.co}"
      AUDIUS_APP_NAME: "${AUDIUS_APP_NAME:-Pinatmenfess}"
      AUDIUS_TIMEOUT_SEC: "${AUDIUS_TIMEOUT_SEC:-8}"
      SPOTIFY_PROVIDER_BASE_URL: "${SPOTIFY_PROVIDER_BASE_URL:-https://spotify.xwolf.space}"
      SPOTIFY_TIMEOUT_SEC: "${SPOTIFY_TIMEOUT_SEC:-5}"
      APPLE_ITUNES_COUNTRY: "${APPLE_ITUNES_COUNTRY:-ID}"
      APPLE_TIMEOUT_SEC: "${APPLE_TIMEOUT_SEC:-5}"
      MUSIC_CACHE_TTL: "${MUSIC_CACHE_TTL:-60}"

      RENDERER_URL: "http://renderer:8766"

    depends_on:
      - ytmusic
      - renderer

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  pinatmenfess-queue:
    build:
      context: .
      dockerfile: Dockerfile

    pull_policy: build
    restart: unless-stopped

    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]

    environment:
      APP_NAME: "${APP_NAME:-Fess}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "false"
      APP_URL: "${APP_URL}"

      APP_LOCALE: "${APP_LOCALE:-en}"
      APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE:-en}"
      APP_MAINTENANCE_DRIVER: "${APP_MAINTENANCE_DRIVER:-file}"

      BCRYPT_ROUNDS: "${BCRYPT_ROUNDS:-12}"

      LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
      LOG_STACK: "${LOG_STACK:-single}"
      LOG_LEVEL: "${LOG_LEVEL:-error}"

      DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"

      SESSION_DRIVER: "${SESSION_DRIVER:-redis}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-redis}"
      CACHE_STORE: "${CACHE_STORE:-redis}"

      REDIS_CLIENT: "${REDIS_CLIENT:-phpredis}"
      REDIS_HOST: "${REDIS_HOST}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-null}"
      REDIS_PORT: "${REDIS_PORT:-6379}"

      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-s3}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
      AWS_BUCKET: "${AWS_BUCKET}"
      AWS_ENDPOINT: "${AWS_ENDPOINT}"
      AWS_USE_PATH_STYLE_ENDPOINT: "${AWS_USE_PATH_STYLE_ENDPOINT:-true}"

      PUBLIC_ID_PREFIX: "${PUBLIC_ID_PREFIX:-MF}"

      RENDERER_URL: "http://renderer:8766"

    depends_on:
      - ytmusic
      - renderer

  ytmusic:
    build:
      context: services/ytmusic
      dockerfile: Dockerfile

    pull_policy: build
    restart: unless-stopped

  renderer:
    build:
      context: services/renderer
      dockerfile: Dockerfile

    pull_policy: build
    restart: unless-stopped
